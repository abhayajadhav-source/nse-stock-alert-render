# Render Blueprint — four cron jobs sharing one Postgres database.
#
# Job 1: nse-stock-alert         → intraday scanner, every 30 min, market hours
# Job 2: nse-momentum-report     → 30-day gainers/losers, daily 17:30 IST
# Job 3: nse-reversal-report     → trend reversal scan, daily 18:00 IST
# Job 4: nse-journal-report      → end-of-day journal, daily 16:00 IST (NEW)

services:
  # ----------- Intraday scanner -----------
  - type: cron
    name: nse-stock-alert
    runtime: python
    plan: starter
    region: singapore
    schedule: "*/30 3-10 * * 1-5"  # every 30 min, 09:00-15:45 IST, Mon-Fri
    buildCommand: pip install -r requirements.txt
    startCommand: python src/scan_once.py
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: nse-alert-state
          property: connectionString

  # ----------- 30-day momentum report -----------
  - type: cron
    name: nse-momentum-report
    runtime: python
    plan: starter
    region: singapore
    schedule: "0 12 * * 1-5"       # 17:30 IST = 12:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python src/scan_once.py
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: RUN_MODE
        value: momentum
      - key: DATABASE_URL
        fromDatabase:
          name: nse-alert-state
          property: connectionString

  # ----------- Trend reversal report -----------
  - type: cron
    name: nse-reversal-report
    runtime: python
    plan: starter
    region: singapore
    schedule: "30 12 * * 1-5"      # 18:00 IST = 12:30 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python src/scan_once.py
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: RUN_MODE
        value: reversal
      - key: DATABASE_URL
        fromDatabase:
          name: nse-alert-state
          property: connectionString

  # ----------- End-of-day journal (NEW) -----------
  # Runs at 16:00 IST = 10:30 UTC. After market close (15:30), giving 30 min
  # for closing prices to settle. Runs BEFORE momentum (17:30) and reversal
  # (18:00) so the journal captures only intraday alerts from earlier today.
  - type: cron
    name: nse-journal-report
    runtime: python
    plan: starter
    region: singapore
    schedule: "30 10 * * 1-5"      # 16:00 IST = 10:30 UTC, Mon-Fri
    buildCommand: pip install -r requirements.txt
    startCommand: python src/scan_once.py
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: RUN_MODE
        value: journal
      - key: DATABASE_URL
        fromDatabase:
          name: nse-alert-state
          property: connectionString

databases:
  - name: nse-alert-state
    plan: free
    region: singapore
    databaseName: nse_alerts
    user: nse_alerts_user
