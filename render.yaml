# Render Blueprint — defines our cron job + free Postgres database.
# When you connect this repo to Render, it reads this file and provisions
# everything in one click.

services:
  - type: cron
    name: nse-stock-alert
    runtime: python
    plan: starter           # $1/mo minimum, billed per-second when running
    region: singapore       # closest to NSE data sources
    schedule: "*/5 3-10 * * 1-5"   # every 5 min, 03:30-10:15 UTC, Mon-Fri
                                   # = 09:00-15:45 IST coverage
    buildCommand: pip install -r requirements.txt
    startCommand: python src/scan_once.py
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: nse-alert-state
          property: connectionString
      # Gmail credentials are set manually in the dashboard for security.
      # Render won't expose them in the YAML.

databases:
  - name: nse-alert-state
    plan: free              # 1 GB Postgres, free forever
    region: singapore
    databaseName: nse_alerts
    user: nse_alerts_user
