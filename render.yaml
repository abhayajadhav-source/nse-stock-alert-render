# Render Blueprint — three cron jobs sharing one Postgres database.
#
# Job 1: nse-stock-alert         → intraday scanner, every 30 min, market hours
# Job 2: nse-momentum-report     → 30-day gainers/losers, once daily at 17:30 IST
# Job 3: nse-reversal-report     → trend reversal scan, once daily at 18:00 IST

services:
  # ----------- Intraday scanner -----------
  - type: cron
    name: nse-stock-alert
    runtime: python
    plan: starter
    region: singapore
    schedule: "*/30 3-10 * * 1-5"  # every 30 min, 09:00-15:45 IST, Mon-Fri
    buildCommand: pip install -r requirements.txt
    startCommand: python src/scan_once.py
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: nse-alert-state
          property: connectionString

  # ----------- 30-day momentum report -----------
  - type: cron
    name: nse-momentum-report
    runtime: python
    plan: starter
    region: singapore
    schedule: "0 12 * * 1-5"       # 12:00 UTC = 17:30 IST, Mon-Fri
    buildCommand: pip install -r requirements.txt
    startCommand: python src/scan_once.py
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: RUN_MODE
        value: momentum
      - key: DATABASE_URL
        fromDatabase:
          name: nse-alert-state
          property: connectionString

  # ----------- Trend reversal report (NEW) -----------
  - type: cron
    name: nse-reversal-report
    runtime: python
    plan: starter
    region: singapore
    schedule: "30 12 * * 1-5"      # 12:30 UTC = 18:00 IST, Mon-Fri
    buildCommand: pip install -r requirements.txt
    startCommand: python src/scan_once.py
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: RUN_MODE              # triggers reversal mode
        value: reversal
      - key: DATABASE_URL
        fromDatabase:
          name: nse-alert-state
          property: connectionString

databases:
  - name: nse-alert-state
    plan: free
    region: singapore
    databaseName: nse_alerts
    user: nse_alerts_user
